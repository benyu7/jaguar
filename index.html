<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaguar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="vrule" aria-hidden="true"></div>

    <main class="container">
      <section class="auth">
        <div id="auth-checking">
          <p class="hint">Asking the GitHub CLI who you are…</p>
        </div>

        <div id="auth-signed-in" hidden>
          <img class="avatar" id="avatar" alt="" />
          <span id="who"></span>
        </div>

        <div id="auth-unavailable" hidden>
          <p id="auth-error"></p>
          <button type="button" class="secondary" id="retry">Try again</button>
        </div>
      </section>

      <section id="prs" hidden>
        <!-- Pico's nav is the heading-left/action-right row, and it gives a
             button inside `nav li` the compact padding and no bottom margin. -->
        <nav>
          <ul>
            <li><h2>Your open pull requests</h2></li>
          </ul>
          <ul>
            <li>
              <button type="button" class="secondary outline" id="refresh-prs">
                Refresh
              </button>
            </li>
          </ul>
        </nav>

        <p class="hint" id="prs-status" hidden></p>

        <!-- A table rather than a list: Pico rules the rows and aligns the
             columns without any styling of ours. -->
        <table id="pr-table" hidden>
          <thead>
            <tr>
              <th scope="col">Pull request</th>
              <th scope="col">Updated</th>
            </tr>
          </thead>
          <tbody id="pr-list"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
