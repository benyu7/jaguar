<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaguar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="vrule" aria-hidden="true"></div>

    <main class="container">
      <img src="/src/assets/jaguar.png" class="logo" alt="" />
      <h1>Jaguar</h1>

      <section class="auth">
        <div id="auth-checking">
          <p class="hint">Asking the GitHub CLI who you are…</p>
        </div>

        <div id="auth-signed-in" class="row" hidden>
          <img class="avatar" id="avatar" alt="" />
          <span id="who"></span>
        </div>

        <div id="auth-unavailable" hidden>
          <p class="auth-error" id="auth-error"></p>
          <button type="button" id="retry">Try again</button>
        </div>
      </section>

      <section class="prs" id="prs" hidden>
        <div class="prs-head">
          <h2>Your open pull requests</h2>
          <button type="button" id="refresh-prs">Refresh</button>
        </div>
        <p class="hint" id="prs-status" hidden></p>
        <ul class="pr-list" id="pr-list"></ul>
      </section>
    </main>
  </body>
</html>
